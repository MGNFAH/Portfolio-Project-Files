<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-900">
  <main class="mx-auto max-w-5xl p-6">
    <h1 class="mb-8 text-3xl font-bold">Blog</h1>
    <section id="posts" class="grid gap-6 md:grid-cols-3"></section>
  </main>

  <script>
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));

    fetch('content/blog.json')
      .then(r => r.json())
      .then(({ posts }) => {
        posts.sort((a, b) => b.data.localeCompare(a.data)); // più recenti prima
        document.getElementById('posts').innerHTML = posts.map(p => `
          <a href="post.html?slug=${encodeURIComponent(p.slug)}"
             class="block overflow-hidden rounded-xl border shadow-sm transition hover:shadow-md">
            ${p.immagine ? `<img src="${esc(p.immagine)}" alt="${esc(p.titolo)}" class="h-48 w-full object-cover">` : ''}
            <div class="p-4">
              <p class="text-sm text-gray-500">${esc(p.data)}</p>
              <h2 class="text-lg font-semibold">${esc(p.titolo)}</h2>
              <p class="mt-2 text-gray-600">${esc(p.riassunto)}</p>
            </div>
          </a>
        `).join('');
      });
  </script>
</body>
</html>
