    <article id="post" class="mt-6"></article>
  </main>
<footer class="">  </footer>
  <script>
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));

    const slug = new URLSearchParams(location.search).get('slug');
    const box = document.getElementById('post');

    fetch('content/blog.json')
      .then(r => r.json())
      .then(({ posts }) => {
        const p = posts.find(x => x.slug === slug);
        if (!p) {
          box.innerHTML = '<p>Post non trovato.</p>';
          return;
        }
        document.title = p.titolo;
        box.innerHTML = `
          <p class="text-sm text-white ">${esc(p.data)}</p>
          <h1 class="mt-1 text-4xl font-bold text-white">${esc(p.titolo)}</h1>
          ${p.immagine ? `<img src="${esc(p.immagine)}" alt="${esc(p.titolo)}" class="my-6 w-full rounded-xl">` : ''}
          <div class="prose prose-lg max-w-none text-white">
            ${DOMPurify.sanitize(marked.parse(p.contenuto || ''))}
          </div>
        `;
      });
  </script>
